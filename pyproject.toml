[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos"
version = "0.1.0"
description = "Internet measurement service: ZMap/ZGrab2 scanning, fingerprinting, and hourly publish to Opteryx"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.34.2,<3",
    "opteryx-upload>=0.2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
dev = [
    "pytest>=7",
    "responses>=0.23",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.scripts]
ichnos = "ichnos.cli:main"

[project.urls]
Homepage = "https://github.com/mabel-dev/ichnos"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py39'
